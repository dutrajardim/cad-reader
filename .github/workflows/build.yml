name: Build e verificação do JAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 11 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Compilar e empacotar
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verificar execução do JAR
        run: java "-Djava.awt.headless=true" -jar target/java-cad-reader-1.0.0.jar --help
      - name: Executar testes sem interface
        run: python tests/run_tests.py
      - name: Verificar protocolo com broker local
        if: runner.os == 'Linux'
        run: python tests/mock_broker.py

  artifact:
    name: Disponibilizar JAR validado
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Gerar JAR para distribuição
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Disponibilizar download
        uses: actions/upload-artifact@v6
        with:
          name: java-cad-reader-${{ github.sha }}
          path: target/java-cad-reader-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar download da versão mais recente
    needs: artifact
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-release-main
      cancel-in-progress: false
    steps:
      - name: Baixar o JAR validado
        uses: actions/download-artifact@v7
        with:
          name: java-cad-reader-${{ github.sha }}
          path: dist
      - name: Publicar Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Uma reexecução antiga não deve substituir o download de main atual.
          main_sha="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "main já avançou; publicação deste commit ignorada."
            exit 0
          fi
          cp dist/java-cad-reader-1.0.0.jar dist/cad-reader.jar
          tag="build-$GITHUB_SHA"
          printf 'Build automático de main.\n\nCommit: %s\n\nRequer Java 11+ e ambiente gráfico. Informe as credenciais na interface.\n' "$GITHUB_SHA" > dist/release-notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/cad-reader.jar --clobber
            gh release edit "$tag" --title "CAD Reader — main" --notes-file dist/release-notes.md --latest
          else
            gh release create "$tag" dist/cad-reader.jar \
              --target "$GITHUB_SHA" --title "CAD Reader — main" \
              --notes-file dist/release-notes.md --latest
          fi
